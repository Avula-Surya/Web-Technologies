<!doctype html>
<html>
  <head>
    <title>Employee Management System</title>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(to right, #4e73df, #1cc88a);
        margin: 0;
        padding: 0;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }

      .form-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      input {
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        width: 180px;
        transition: 0.3s;
      }

      input:focus {
        border-color: #4e73df;
        outline: none;
        box-shadow: 0 0 5px rgba(78, 115, 223, 0.5);
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }

      button:hover {
        opacity: 0.85;
      }

      .add-btn {
        background: #1cc88a;
        color: white;
      }
      .update-btn {
        background: #f6c23e;
        color: white;
      }
      .delete-btn {
        background: #e74a3b;
        color: white;
      }

      table {
        width: 100%;
        margin-top: 25px;
        border-collapse: collapse;
      }

      th {
        background: #4e73df;
        color: white;
        padding: 12px;
      }

      td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }

      tr:hover {
        background: #f8f9fc;
        cursor: pointer;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
        transition: 0.3s;
      }

      .success {
        color: #1cc88a;
      }

      .error {
        color: #e74a3b;
      }

      @media (max-width: 768px) {
        .form-group {
          flex-direction: column;
          align-items: center;
        }

        input {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Employee Management System</h2>

      <div class="form-group">
        <input type="text" id="empId" placeholder="Employee ID" />
        <input type="text" id="empName" placeholder="Name" />
        <input type="text" id="empDept" placeholder="Department" />
        <input type="text" id="empSalary" placeholder="Salary" />

        <button class="add-btn" onclick="addEmployee()">Add</button>
        <button class="update-btn" onclick="updateEmployee()">Update</button>
        <button class="delete-btn" onclick="deleteEmployee()">Delete</button>
      </div>

      <p id="message"></p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
          </tr>
        </thead>
        <tbody id="empTableBody"></tbody>
      </table>
    </div>

    <script>
      let xmlDoc;

      function loadEmployees() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "employees.xml", true);

        xhr.onload = function () {
          if (xhr.status === 200) {
            xmlDoc = xhr.responseXML;

            if (!xmlDoc) {
              showMessage("Malformed XML!", "error");
              return;
            }

            displayEmployees();
          } else {
            showMessage("Failed to load XML!", "error");
          }
        };

        xhr.send();
      }

      function displayEmployees() {
        const tableBody = document.getElementById("empTableBody");
        tableBody.innerHTML = "";

        const employees = xmlDoc.getElementsByTagName("employee");

        if (employees.length === 0) {
          showMessage("No employees found!", "error");
          return;
        }

        for (let i = 0; i < employees.length; i++) {
          const id = employees[i].getElementsByTagName("id")[0].textContent;
          const name = employees[i].getElementsByTagName("name")[0].textContent;
          const dept =
            employees[i].getElementsByTagName("department")[0].textContent;
          const salary =
            employees[i].getElementsByTagName("salary")[0].textContent;

          const row = `
            <tr onclick="fillFields('${id}','${name}','${dept}','${salary}')">
                <td>${id}</td>
                <td>${name}</td>
                <td>${dept}</td>
                <td>${salary}</td>
            </tr>
        `;

          tableBody.innerHTML += row;
        }
      }

      function fillFields(id, name, dept, salary) {
        document.getElementById("empId").value = id;
        document.getElementById("empName").value = name;
        document.getElementById("empDept").value = dept;
        document.getElementById("empSalary").value = salary;
      }

      function clearFields() {
        document.getElementById("empId").value = "";
        document.getElementById("empName").value = "";
        document.getElementById("empDept").value = "";
        document.getElementById("empSalary").value = "";
      }

      function addEmployee() {
        const id = empId.value;
        const name = empName.value;
        const dept = empDept.value;
        const salary = empSalary.value;

        if (!id || !name || !dept || !salary) {
          showMessage("All fields required!", "error");
          return;
        }

        const newEmp = xmlDoc.createElement("employee");

        newEmp.innerHTML = `
        <id>${id}</id>
        <name>${name}</name>
        <department>${dept}</department>
        <salary>${salary}</salary>
    `;

        xmlDoc.getElementsByTagName("employees")[0].appendChild(newEmp);

        displayEmployees();
        clearFields();
        showMessage("Employee added!", "success");
      }

      function updateEmployee() {
        const id = empId.value;
        const employees = xmlDoc.getElementsByTagName("employee");

        for (let i = 0; i < employees.length; i++) {
          if (employees[i].getElementsByTagName("id")[0].textContent === id) {
            employees[i].getElementsByTagName("department")[0].textContent =
              empDept.value;
            employees[i].getElementsByTagName("salary")[0].textContent =
              empSalary.value;

            displayEmployees();
            clearFields();
            showMessage("Employee updated!", "success");
            return;
          }
        }

        showMessage("Employee not found!", "error");
      }

      function deleteEmployee() {
        const id = empId.value;
        const employees = xmlDoc.getElementsByTagName("employee");

        for (let i = 0; i < employees.length; i++) {
          if (employees[i].getElementsByTagName("id")[0].textContent === id) {
            employees[i].parentNode.removeChild(employees[i]);

            displayEmployees();
            clearFields();
            showMessage("Employee deleted!", "success");
            return;
          }
        }

        showMessage("Employee not found!", "error");
      }

      function showMessage(msg, type) {
        const message = document.getElementById("message");
        message.textContent = msg;
        message.className = type;
      }

      window.onload = loadEmployees;
    </script>
  </body>
</html>
