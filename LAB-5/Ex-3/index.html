<!doctype html>
<html>
  <head>
    <title>Student Record System</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(
          circle at top left,
          #0f0c29,
          #302b63,
          #24243e
        );
        color: #ffffff;
      }

      .container {
        width: 95%;
        max-width: 1100px;
        margin: 50px auto;
        padding: 30px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #00f7ff;
      }

      .form-group {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        margin-bottom: 25px;
      }

      input {
        padding: 10px;
        width: 200px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        transition: 0.3s ease;
      }

      input::placeholder {
        color: #ccc;
      }

      input:focus {
        outline: none;
        border-color: #00f7ff;
        box-shadow: 0 0 10px #00f7ff;
      }

      button {
        padding: 10px 20px;
        border-radius: 50px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .add {
        background: linear-gradient(45deg, #00ff87, #60efff);
        color: black;
      }
      .update {
        background: linear-gradient(45deg, #f7971e, #ffd200);
        color: black;
      }
      .delete {
        background: linear-gradient(45deg, #ff416c, #ff4b2b);
        color: white;
      }

      button:hover {
        transform: translateY(-3px);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 20px;
        overflow: hidden;
      }

      th {
        background: linear-gradient(90deg, #00f7ff, #00c3ff);
        color: black;
        padding: 12px;
      }

      td {
        padding: 12px;
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      tr:hover td {
        background: rgba(0, 247, 255, 0.2);
        cursor: pointer;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }

      .success {
        color: #00ff9d;
      }
      .error {
        color: #ff4b5c;
      }

      @media (max-width: 768px) {
        .form-group {
          flex-direction: column;
          align-items: center;
        }
        input,
        button {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>🎓 Student Record System</h2>

      <div class="form-group">
        <input type="text" id="studentId" placeholder="Student ID" />
        <input type="text" id="name" placeholder="Name" />
        <input type="text" id="course" placeholder="Course" />
        <input type="number" id="marks" placeholder="Marks" />

        <button class="add" onclick="addStudent()">Add</button>
        <button class="update" onclick="updateStudent()">Update</button>
        <button class="delete" onclick="deleteStudent()">Delete</button>
      </div>

      <p id="message"></p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <script>
      let students = [];
      let dataLoaded = false;

      // LOAD JSON
      async function loadStudents() {
        try {
          const response = await fetch("./students.json");

          if (!response.ok) throw new Error("HTTP Error: " + response.status);

          students = await response.json();
          dataLoaded = true; // JSON loaded successfully
          displayStudents();
        } catch (error) {
          showMessage("JSON Error: " + error.message, "error");
        }
      }

      // DISPLAY STUDENTS
      function displayStudents() {
        const table = document.getElementById("studentTable");
        table.innerHTML = "";

        students.forEach((s) => {
          const row = `
            <tr onclick="fillFields('${s.id}','${s.name}','${s.course}','${s.marks}')">
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.course}</td>
                <td>${s.marks}</td>
            </tr>
        `;
          table.innerHTML += row;
        });
      }

      // FILL FIELDS
      function fillFields(id, nameVal, courseVal, marksVal) {
        studentId.value = id;
        name.value = nameVal;
        course.value = courseVal;
        marks.value = marksVal;
      }

      // ADD STUDENT
      function addStudent() {
        if (!dataLoaded) {
          showMessage("Wait... JSON is still loading.", "error");
          return;
        }

        if (
          !studentId.value.trim() ||
          !name.value.trim() ||
          !course.value.trim() ||
          !marks.value.trim()
        ) {
          showMessage("All fields required!", "error");
          return;
        }

        if (students.some((s) => s.id === studentId.value)) {
          showMessage("Student ID already exists!", "error");
          return;
        }

        students.push({
          id: studentId.value,
          name: name.value,
          course: course.value,
          marks: parseInt(marks.value),
        });

        displayStudents();
        clearFields();
        showMessage("Student added successfully!", "success");
      }

      // UPDATE STUDENT
      function updateStudent() {
        const student = students.find((s) => s.id === studentId.value);

        if (!student) {
          showMessage("Student not found!", "error");
          return;
        }

        if (course.value.trim()) student.course = course.value;
        if (marks.value.trim()) student.marks = parseInt(marks.value);

        displayStudents();
        clearFields();
        showMessage("Student updated successfully!", "success");
      }

      // DELETE STUDENT
      function deleteStudent() {
        const index = students.findIndex((s) => s.id === studentId.value);

        if (index === -1) {
          showMessage("Student not found!", "error");
          return;
        }

        students.splice(index, 1);

        displayStudents();
        clearFields();
        showMessage("Student deleted successfully!", "success");
      }

      // CLEAR FIELDS
      function clearFields() {
        studentId.value = "";
        name.value = "";
        course.value = "";
        marks.value = "";
      }

      // SHOW MESSAGE
      function showMessage(msg, type) {
        const m = document.getElementById("message");
        m.textContent = msg;
        m.className = type;
      }

      window.onload = loadStudents;
    </script>
  </body>
</html>
