<!doctype html>
<html>
  <head>
    <title>Product Inventory System</title>

    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
      }

      .container {
        width: 95%;
        max-width: 1200px;
        margin: 40px auto;
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      .form-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 20px;
      }

      input {
        padding: 10px;
        width: 180px;
        border-radius: 12px;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
      }

      input::placeholder {
        color: #ddd;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      .add {
        background: #00ff87;
      }
      .update {
        background: #ffc107;
      }
      .delete {
        background: #ff5252;
      }
      .search-btn {
        background: #00eaff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 25px;
      }

      th {
        background: rgba(0, 0, 0, 0.5);
        padding: 12px;
      }

      td {
        padding: 12px;
        text-align: center;
        background: rgba(255, 255, 255, 0.15);
      }

      tr:hover td {
        background: rgba(255, 255, 255, 0.25);
      }

      .low-stock {
        color: #ff5252;
        font-weight: bold;
      }

      #totalValue {
        margin-top: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: 600;
      }

      #message {
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
      }

      .success {
        color: #00ff87;
      }
      .error {
        color: #ff5252;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>📦 Product Inventory System</h2>

      <div class="form-group">
        <input type="text" id="productId" placeholder="Product ID" />
        <input type="text" id="name" placeholder="Product Name" />
        <input type="text" id="category" placeholder="Category" />
        <input type="number" id="price" placeholder="Price" />
        <input type="number" id="stock" placeholder="Stock" />

        <button class="add" onclick="addProduct()">Add</button>
        <button class="update" onclick="updateProduct()">Update</button>
        <button class="delete" onclick="deleteProduct()">Delete</button>
      </div>

      <div class="form-group">
        <input type="text" id="searchCat" placeholder="Search Category" />
        <button class="search-btn" onclick="searchCategory()">Search</button>
      </div>

      <p id="message"></p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price ₹</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
      </table>

      <p id="totalValue"></p>
    </div>

    <script>
      let products = [];
      let dataLoaded = false;

      // Load JSON
      async function loadInventory() {
        try {
          const response = await fetch("./inventory.json");
          if (!response.ok) throw new Error("Failed to load JSON");

          products = await response.json();
          dataLoaded = true;
          displayProducts(products);
        } catch (error) {
          showMessage("JSON Error: " + error.message, "error");
        }
      }

      // Display products
      function displayProducts(list) {
        const table = document.getElementById("inventoryTable");
        table.innerHTML = "";

        list.forEach((p) => {
          const row = `
        <tr onclick="fillFields('${p.id}','${p.name}','${p.category}','${p.price}','${p.stock}')">
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.category}</td>
            <td>₹${p.price}</td>
            <td class="${p.stock < 10 ? "low-stock" : ""}">${p.stock}</td>
        </tr>`;

          table.innerHTML += row;
        });

        updateTotalValue();
      }

      // Calculate inventory value
      function updateTotalValue() {
        const total = products.reduce((sum, p) => sum + p.price * p.stock, 0);
        document.getElementById("totalValue").textContent =
          "💰 Total Inventory Value: ₹" + total;
      }

      // Fill fields when row clicked
      function fillFields(id, name, cat, price, stock) {
        productId.value = id;
        document.getElementById("name").value = name;
        category.value = cat;
        document.getElementById("price").value = price;
        document.getElementById("stock").value = stock;
      }

      // Add product
      function addProduct() {
        if (!dataLoaded) return showMessage("Loading data... wait!", "error");

        if (
          !productId.value ||
          !name.value ||
          !category.value ||
          !price.value ||
          !stock.value
        ) {
          return showMessage("All fields required!", "error");
        }

        if (products.some((p) => p.id === productId.value))
          return showMessage("Product ID already exists!", "error");

        if (price.value <= 0 || stock.value < 0)
          return showMessage("Invalid price or stock!", "error");

        products.push({
          id: productId.value,
          name: name.value,
          category: category.value,
          price: parseFloat(price.value),
          stock: parseInt(stock.value),
        });

        displayProducts(products);
        clearFields();
        showMessage("Product added!", "success");
      }

      // Update product
      function updateProduct() {
        const p = products.find((prod) => prod.id === productId.value);
        if (!p) return showMessage("Product not found!", "error");

        if (price.value) p.price = parseFloat(price.value);
        if (stock.value) p.stock = parseInt(stock.value);

        displayProducts(products);
        clearFields();
        showMessage("Product updated!", "success");
      }

      // Delete product
      function deleteProduct() {
        const index = products.findIndex((p) => p.id === productId.value);
        if (index === -1) return showMessage("Product not found!", "error");

        products.splice(index, 1);

        displayProducts(products);
        clearFields();
        showMessage("Product deleted!", "success");
      }

      // Search by category
      function searchCategory() {
        if (!searchCat.value.trim()) {
          displayProducts(products);
          return;
        }

        const filtered = products.filter(
          (p) => p.category.toLowerCase() === searchCat.value.toLowerCase(),
        );

        if (filtered.length === 0)
          return showMessage("No products found in this category!", "error");

        displayProducts(filtered);
      }

      // Clear inputs
      function clearFields() {
        productId.value = "";
        name.value = "";
        category.value = "";
        price.value = "";
        stock.value = "";
      }

      // Show message
      function showMessage(msg, type) {
        const m = document.getElementById("message");
        m.textContent = msg;
        m.className = type;
      }

      window.onload = loadInventory;
    </script>
  </body>
</html>
