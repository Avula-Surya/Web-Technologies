<!doctype html>
<html lang="en">
  <head>
    <title>Student Marks Calculator</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        padding: 30px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        color: white;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 14px;
      }

      input::placeholder {
        color: #ddd;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: linear-gradient(45deg, #ff7eb3, #ff758c);
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .result {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.3);
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Marks Calculator</h2>

      <input type="text" id="name" placeholder="Enter Student Name" />
      <input type="number" id="m1" placeholder="Enter Mark 1" />
      <input type="number" id="m2" placeholder="Enter Mark 2" />
      <input type="number" id="m3" placeholder="Enter Mark 3" />

      <button onclick="calculate()">Calculate</button>

      <div class="result" id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
