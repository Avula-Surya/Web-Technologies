<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Notes Manager | Professional</title>
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --accent: #10b981;
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
        --danger: #ef4444;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 900px;
      }

      /* Header & Toast */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      #status-msg {
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.3s;
        opacity: 0;
      }
      .show-msg {
        opacity: 1 !important;
      }

      /* Form */
      .form-box {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        margin-bottom: 40px;
        border: 1px solid #334155;
      }

      input,
      textarea {
        width: 100%;
        background: #0f172a;
        border: 1px solid #334155;
        color: white;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        box-sizing: border-box;
      }

      input:focus {
        outline: 2px solid var(--accent);
        border-color: transparent;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        background: var(--accent);
        color: var(--bg);
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn-cancel {
        background: #334155;
        color: white;
        display: none;
      }

      /* Notes List */
      .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      .note-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        position: relative;
        border-top: 4px solid var(--accent);
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .note-card h3 {
        margin: 0 0 5px 0;
        color: var(--accent);
      }
      .note-card .subject {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-dim);
      }
      .note-card p {
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.6;
      }

      .card-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #334155;
        padding-top: 15px;
      }
      .action-icon {
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      .edit-icon {
        color: var(--accent);
      }
      .del-icon {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Study Vault</h1>
        <div id="status-msg"></div>
      </div>

      <div class="form-box">
        <input type="text" id="title" placeholder="Topic Title" />
        <input type="text" id="subject" placeholder="Course/Subject" />
        <textarea
          id="description"
          rows="3"
          placeholder="Core concepts..."
        ></textarea>
        <div class="btn-group">
          <button id="mainBtn" onclick="handleAction()">Save to Vault</button>
          <button id="cancelBtn" class="btn-cancel" onclick="resetForm()">
            Cancel
          </button>
        </div>
      </div>

      <div class="notes-grid" id="notesList"></div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/notes";
      let editModeId = null;

      // Toast Notification System
      function notify(text, color = "#10b981") {
        const msg = document.getElementById("status-msg");
        msg.innerText = text;
        msg.style.background = color;
        msg.classList.add("show-msg");
        setTimeout(() => msg.classList.remove("show-msg"), 3000);
      }

      // Load Data
      async function fetchNotes() {
        const res = await fetch(API_URL);
        const notes = await res.json();
        const list = document.getElementById("notesList");
        list.innerHTML = notes
          .map(
            (n) => `
            <div class="note-card">
                <div class="subject">${n.subject}</div>
                <h3>${n.title}</h3>
                <p>${n.description}</p>
                <div class="card-actions">
                    <span class="action-icon edit-icon" onclick="setEditMode('${n._id}', '${n.title}', '${n.subject}', '${n.description}')">EDIT</span>
                    <span class="action-icon del-icon" onclick="deleteNote('${n._id}')">DELETE</span>
                </div>
            </div>
        `,
          )
          .join("");
      }

      // Add / Update
      async function handleAction() {
        const title = document.getElementById("title").value.trim();
        const subject = document.getElementById("subject").value.trim();
        const description = document.getElementById("description").value.trim();

        if (!title || !subject || !description) {
          notify("Fields cannot be empty!", "#ef4444");
          return;
        }

        const data = { title, subject, description };

        if (editModeId) {
          await fetch(`${API_URL}/${editModeId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          notify("Note Updated Successfully");
        } else {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          notify("Note Added to Vault");
        }

        resetForm();
        fetchNotes();
      }

      function setEditMode(id, t, s, d) {
        editModeId = id;
        document.getElementById("title").value = t;
        document.getElementById("subject").value = s;
        document.getElementById("description").value = d;
        document.getElementById("mainBtn").innerText = "Update Record";
        document.getElementById("cancelBtn").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function resetForm() {
        editModeId = null;
        document.getElementById("title").value = "";
        document.getElementById("subject").value = "";
        document.getElementById("description").value = "";
        document.getElementById("mainBtn").innerText = "Save to Vault";
        document.getElementById("cancelBtn").style.display = "none";
      }

      async function deleteNote(id) {
        // No browser confirm prompt - direct delete with undo-style notification
        await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        notify("Note Deleted", "#334155");
        fetchNotes();
      }

      fetchNotes();
    </script>
  </body>
</html>
